[package]
name = "shanti-gui-rust"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Rust migration shell for the Shanti Keyboard desktop application."
publish = false

[[bin]]
name = "shanti-gui-rust"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.8.0" }
gtk = { package = "gtk4", version = "0.10.1" }
gdk-pixbuf = { package = "gdk-pixbuf", version = "0.20.0" }
serde_json = "1"
shanti-paths = { path = "../shanti-paths" }
shanti-config = { path = "../shanti-config" }
shanti-layout = { path = "../shanti-layout" }
shanti-desktop = { path = "../shanti-desktop" }
