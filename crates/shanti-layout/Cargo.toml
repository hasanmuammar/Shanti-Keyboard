[package]
name = "shanti-layout"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "Shanti Keyboard layout-file model (description, fixed-layout key map) and the Qt-compatible base91+zstd layout-image decoder used by the GTK layout viewer."
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
serde_json = "1"
zstd = "0.13"
