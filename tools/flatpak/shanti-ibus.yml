app-id: org.shanti.ShantiIbus
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: shanti-gui
separate-locales: false

# GNOME IBus engine Flatpak — ships the GTK4/libadwaita `shanti-gui` on the
# GNOME 51 runtime. The Qt5 frontend was retired and real-session GNOME
# typing through IBus has been verified, so this is the production manifest.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Settings store and user data for the rebranded layout.
  - --filesystem=xdg-config/Shanti:create
  - --filesystem=xdg-data/shanti-keyboard:create
  # Pre-rebrand locations, read for the one-time legacy migration.
  - --filesystem=xdg-config/OpenBangla:create
  - --filesystem=xdg-data/openbangla-keyboard:create
  - --filesystem=xdg-data/ibus/component:create
  - --filesystem=xdg-data/shanti-ibus:create
  - --filesystem=xdg-config/systemd/user/org.freedesktop.IBus.session.GNOME.service.d:create
  - --talk-name=org.freedesktop.systemd1

modules:
  - name: shanti-keyboard
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_TARGET_DIR: /run/build/shanti-keyboard/cargo-target
    build-commands:
      # Build the IBus engine via CMake (Qt-free, wraps shanti-core).
      # Flatpak Builder runs each build-command in a fresh shell whose
      # working directory is the module source root (/run/build/shanti-keyboard),
      # so use -S . for the source and -B for the out-of-tree build directory.
      # Mirror the proven portable build.sh pattern: cmake configure, then
      # cmake --build / cmake --install (generator-agnostic) rather than
      # calling ninja -C directly.
      - rm -rf /run/build/shanti-keyboard/cmake-build
      - cmake -S . -B /run/build/shanti-keyboard/cmake-build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DBIN_DIR=/app/bin -DDATADIR=/app/share -DLIBEXECDIR=/app/libexec -DENABLE_IBUS=ON
      - cmake --build /run/build/shanti-keyboard/cmake-build --parallel 2
      - cmake --install /run/build/shanti-keyboard/cmake-build
      # Lint and test the GTK GUI before installing it as the production launcher.
      - cargo fmt --check --manifest-path crates/shanti-gui/Cargo.toml
      - cargo test --locked --manifest-path crates/shanti-gui/Cargo.toml
      - cargo clippy --locked --manifest-path crates/shanti-gui/Cargo.toml -- -D warnings
      # Build the GTK GUI via cargo and install as `shanti-gui` (binary-name contract).
      - SHANTI_VERSION="$(cat version.txt)" cargo build --locked --release --manifest-path crates/shanti-gui/Cargo.toml
      - install -Dm755 /run/build/shanti-keyboard/cargo-target/release/shanti-gui-rust /app/bin/shanti-gui
      # Install runtime data files.
      - install -d /app/share/shanti-keyboard/layouts /app/share/shanti-keyboard/data
      - install -m644 data/avrophonetic.json data/Avro_Easy.json data/Borno.json data/Munir_Optima.json data/National_Jatiya.json data/Probhat.json data/UniBijoy.json data/khipro.json /app/share/shanti-keyboard/layouts/
      - install -m644 src/engine/riti/data/autocorrect.json /app/share/shanti-keyboard/data/autocorrect.json
      - install -m644 data/dictionary.json data/suffix.json data/regex.json /app/share/shanti-keyboard/data/
    post-install:
      # Desktop entry: substitute @BIN_DIR@, rename to IBus app id, apply sed renames.
      - sed -e 's#@BIN_DIR@#/app/bin#g' data/shanti-keyboard.desktop.in > /app/share/applications/shanti-keyboard.desktop
      - install -Dm644 /app/share/applications/shanti-keyboard.desktop /app/share/applications/org.shanti.ShantiIbus.desktop
      - sed -i 's/^Name=Shanti Keyboard$/Name=Shanti Keyboard (IBus)/; s/^Icon=shanti-keyboard$/Icon=org.shanti.ShantiIbus/' /app/share/applications/org.shanti.ShantiIbus.desktop
      - rm /app/share/applications/shanti-keyboard.desktop
      # Icons: install data/*.png as org.shanti.ShantiIbus.png in each hicolor size.
      - install -Dm644 data/16.png /app/share/icons/hicolor/16x16/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/24.png /app/share/icons/hicolor/24x24/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/32.png /app/share/icons/hicolor/32x32/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/48.png /app/share/icons/hicolor/48x48/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/64.png /app/share/icons/hicolor/64x64/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/128.png /app/share/icons/hicolor/128x128/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/512.png /app/share/icons/hicolor/512x512/apps/org.shanti.ShantiIbus.png
      - install -Dm644 data/1024.png /app/share/icons/hicolor/1024x1024/apps/org.shanti.ShantiIbus.png || true
      # Metainfo: substitute id/name/icon, rename to IBus app id.
      - sed -e 's#<id>org.shanti.ShantiKeyboard</id>#<id>org.shanti.ShantiIbus</id>#' -e 's#<name>Shanti Keyboard</name>#<name>Shanti Keyboard (IBus)</name>#' -e 's#<icon type="remote"[^>]*>[^<]*</icon>#<icon type="stock">org.shanti.ShantiIbus</icon>#' data/org.shanti.ShantiKeyboard.metainfo.xml > /app/share/metainfo/org.shanti.ShantiIbus.metainfo.xml
    sources:
      - type: dir
        path: ../..
